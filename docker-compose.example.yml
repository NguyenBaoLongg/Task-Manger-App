services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adsup
      POSTGRES_USER: adsup
      POSTGRES_PASSWORD: local-example-only
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U adsup -d adsup']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - adsup-postgres:/var/lib/postgresql/data

volumes:
  adsup-postgres:
