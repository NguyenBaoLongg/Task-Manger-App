openapi: 3.1.0
info:
  title: Adsup Daily KPI API
  version: 0.1.0
  description: Tenant-scoped contracts for Module 2 daily KPI, penalties, evidence debt and action items.
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: KPI Configuration
  - name: KPI Reports
  - name: KPI Evaluation
  - name: Action Items
paths:
  /v1/tenants/{tenantId}/kpi/definitions:
    get:
      tags: [KPI Configuration]
      operationId: listKpiDefinitions
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Tenant-scoped KPI definitions.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KpiDefinitionPage'
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [KPI Configuration]
      operationId: createKpiDefinition
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateKpiDefinitionRequest'
      responses:
        '201':
          description: Created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KpiDefinition' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tenants/{tenantId}/kpi/targets:
    post:
      tags: [KPI Configuration]
      operationId: createKpiTargetVersion
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateTargetRequest' }
      responses:
        '201':
          description: Immutable target version created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TargetVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tenants/{tenantId}/kpi/source-mappings:
    post:
      tags: [KPI Configuration]
      operationId: createKpiSourceMappingVersion
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateSourceMappingRequest' }
      responses:
        '201':
          description: Immutable mapping version created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SourceMappingVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tenants/{tenantId}/kpi/policies:bulk:
    post:
      tags: [KPI Configuration]
      operationId: bulkCreateDailyKpiPolicyVersions
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BulkPolicyRequest' }
      responses:
        '201':
          description: All requested policy versions created atomically.
          content:
            application/json:
              schema:
                type: object
                required: [affectedBranchIds, versions]
                properties:
                  affectedBranchIds:
                    type: array
                    items: { type: string, format: uuid }
                  versions:
                    type: array
                    items: { $ref: '#/components/schemas/DailyKpiPolicyVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tenants/{tenantId}/kpi/policies/effective:
    get:
      tags: [KPI Configuration]
      operationId: getEffectiveDailyKpiPolicy
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: businessDate
          in: query
          required: true
          schema: { type: string, format: date }
      responses:
        '200':
          description: Effective branch override or tenant fallback.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyKpiPolicyVersion' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/tenants/{tenantId}/kpi/reports/{businessDate}/revisions:
    get:
      tags: [KPI Reports]
      operationId: listDailyKpiReportRevisions
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/BusinessDate'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Immutable revision history for the authenticated employee.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportRevisionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [KPI Reports]
      operationId: createDailyKpiReportRevision
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/BusinessDate'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [formSubmissionId]
              properties:
                formSubmissionId: { type: string, format: uuid }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '201':
          description: Revision recorded and progress recalculated.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReportRevision' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/tenants/{tenantId}/kpi/reports/{businessDate}/progress:
    get:
      tags: [KPI Reports]
      operationId: getMyDailyKpiProgress
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/BusinessDate'
      responses:
        '200':
          description: Authoritative current KPI progress.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DailyProgress' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /v1/tenants/{tenantId}/kpi/evaluations:
    get:
      tags: [KPI Evaluation]
      operationId: listDailyKpiEvaluations
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Cursor'
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: membershipId
          in: query
          schema: { type: string, format: uuid }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: status
          in: query
          schema: { $ref: '#/components/schemas/EvaluationStatus' }
      responses:
        '200':
          description: Authorized tenant or branch scoped evaluation page.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvaluationPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/tenants/{tenantId}/kpi/evaluations/{businessDate}/reruns:
    post:
      tags: [KPI Evaluation]
      operationId: enqueueDailyKpiEvaluationRerun
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/BusinessDate'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [reason]
              properties:
                branchIds:
                  type: array
                  uniqueItems: true
                  items: { type: string, format: uuid }
                membershipIds:
                  type: array
                  uniqueItems: true
                  items: { type: string, format: uuid }
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '202':
          description: Retry-safe job accepted. Existing closed outcomes are not rewritten.
          content:
            application/json:
              schema:
                type: object
                required: [jobRunId, status]
                properties:
                  jobRunId: { type: string, format: uuid }
                  status: { type: string, enum: [PENDING, RUNNING, COMPLETED] }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tenants/{tenantId}/kpi/penalties/{penaltyId}/adjustments:
    post:
      tags: [KPI Evaluation]
      operationId: createKpiPenaltyAdjustment
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: penaltyId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [deltaMinor, reason]
              properties:
                deltaMinor:
                  type: string
                  pattern: '^-?[0-9]+$'
                  description: Signed VND minor-unit delta; effective amount may not become negative.
                reason: { type: string, minLength: 3, maxLength: 500 }
      responses:
        '201':
          description: Append-only adjustment created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PenaltyAdjustment' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tenants/{tenantId}/kpi/evidence-debts/{debtId}/refresh:
    post:
      tags: [KPI Reports]
      operationId: refreshEvidenceDebt
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: debtId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Debt count/state refreshed from authorized READY media.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EvidenceDebt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tenants/{tenantId}/action-items:
    get:
      tags: [Action Items]
      operationId: listMyActionItems
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Cursor'
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ActionItemState' }
        - name: businessDate
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Authenticated employee action items and badge count.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ActionItemPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/tenants/{tenantId}/management/action-items:
    get:
      tags: [Action Items]
      operationId: listManagedActionItems
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Cursor'
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: departmentId
          in: query
          schema: { type: string, format: uuid }
        - name: membershipId
          in: query
          schema: { type: string, format: uuid }
        - name: itemType
          in: query
          schema: { $ref: '#/components/schemas/ActionItemType' }
        - name: state
          in: query
          schema: { $ref: '#/components/schemas/ActionItemState' }
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
      responses:
        '200':
          description: Branch-scoped manager feed and aggregate counts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedActionItemPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, format: uuid }
      description: Must match an active membership resolved from the bearer token.
    BusinessDate:
      name: businessDate
      in: path
      required: true
      schema: { type: string, format: date }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 160 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, maxLength: 1024 }
  responses:
    BadRequest:
      description: Validation failed.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unauthorized:
      description: Authentication required or invalid.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Active membership, permission or branch scope is missing.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource is absent in the authorized tenant scope.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Conflict:
      description: Idempotency payload conflict, overlapping version or immutable state conflict.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Unprocessable:
      description: Valid syntax but invalid authoritative source, branch assignment or business rule.
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
  schemas:
    Error:
      type: object
      additionalProperties: false
      required: [code, message, correlationId]
      properties:
        code: { type: string }
        message: { type: string }
        correlationId: { type: string }
        details:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [path, code]
            properties:
              path: { type: string }
              code: { type: string }
    KpiValueType: { type: string, enum: [MONEY, COUNT, PERCENTAGE] }
    KpiDirection: { type: string, enum: [AT_LEAST, AT_MOST] }
    KpiScopeType: { type: string, enum: [TENANT, BRANCH, DEPARTMENT, GROUP, MEMBERSHIP] }
    EvaluationStatus: { type: string, enum: [PASSED, FAILED, EXEMPT] }
    ActionItemState: { type: string, enum: [OPEN, OVERDUE, COMPLETED, DISMISSED] }
    ActionItemType: { type: string, enum: [KPI_REPORT, KPI_SHORTFALL, PHOTO_DEBT, DATA_QUALITY] }
    ExactValue:
      type: object
      additionalProperties: false
      required: [value, unit]
      properties:
        value: { type: string, pattern: '^-?[0-9]+(?:\.[0-9]{1,4})?$' }
        unit: { type: string, minLength: 1, maxLength: 16 }
    KpiDefinition:
      type: object
      additionalProperties: false
      required: [id, code, name, valueType, unit, direction, sourceType, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        description: { type: [string, 'null'] }
        valueType: { $ref: '#/components/schemas/KpiValueType' }
        unit: { type: string }
        direction: { $ref: '#/components/schemas/KpiDirection' }
        sourceType: { type: string, enum: [FORM_FIELD, DOMAIN_ADAPTER] }
        status: { type: string, enum: [ACTIVE, ARCHIVED] }
    CreateKpiDefinitionRequest:
      type: object
      additionalProperties: false
      required: [code, name, valueType, unit, direction, sourceType, reason]
      properties:
        code: { type: string, pattern: '^[A-Z][A-Z0-9_]{1,79}$' }
        name: { type: string, minLength: 1, maxLength: 160 }
        description: { type: string, maxLength: 1000 }
        valueType: { $ref: '#/components/schemas/KpiValueType' }
        unit: { type: string, minLength: 1, maxLength: 16 }
        direction: { $ref: '#/components/schemas/KpiDirection' }
        sourceType: { type: string, enum: [FORM_FIELD, DOMAIN_ADAPTER] }
        reason: { type: string, minLength: 3, maxLength: 500 }
    KpiDefinitionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/KpiDefinition' } }
        nextCursor: { type: [string, 'null'] }
    CreateTargetRequest:
      type: object
      additionalProperties: false
      required: [kpiDefinitionId, scopeType, target, required, effectiveFrom, reason]
      properties:
        kpiDefinitionId: { type: string, format: uuid }
        scopeType: { $ref: '#/components/schemas/KpiScopeType' }
        scopeId: { type: [string, 'null'], format: uuid }
        target: { $ref: '#/components/schemas/ExactValue' }
        required: { type: boolean }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
        reason: { type: string, minLength: 3, maxLength: 500 }
    TargetVersion:
      type: object
      additionalProperties: false
      required: [id, versionNumber, kpiDefinitionId, scopeType, target, required, effectiveFrom, reason]
      properties:
        id: { type: string, format: uuid }
        versionNumber: { type: integer, minimum: 1 }
        kpiDefinitionId: { type: string, format: uuid }
        scopeType: { $ref: '#/components/schemas/KpiScopeType' }
        scopeId: { type: [string, 'null'], format: uuid }
        target: { $ref: '#/components/schemas/ExactValue' }
        required: { type: boolean }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
        reason: { type: string }
    CreateSourceMappingRequest:
      type: object
      additionalProperties: false
      required: [kpiDefinitionId, sourceType, effectiveFrom, reason]
      properties:
        kpiDefinitionId: { type: string, format: uuid }
        sourceType: { type: string, enum: [FORM_FIELD, DOMAIN_ADAPTER] }
        formTemplateId: { type: [string, 'null'], format: uuid }
        formVersionId: { type: [string, 'null'], format: uuid }
        jsonPointer: { type: [string, 'null'], pattern: '^/' }
        adapterCode: { type: [string, 'null'], maxLength: 80 }
        aggregation: { type: string, enum: [LATEST, SUM, COUNT, RATIO] }
        requiresEvidence: { type: boolean, default: false }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
        reason: { type: string, minLength: 3, maxLength: 500 }
    SourceMappingVersion:
      type: object
      additionalProperties: false
      required: [id, versionNumber, kpiDefinitionId, sourceType, aggregation, requiresEvidence, effectiveFrom, reason]
      properties:
        id: { type: string, format: uuid }
        versionNumber: { type: integer, minimum: 1 }
        kpiDefinitionId: { type: string, format: uuid }
        sourceType: { type: string, enum: [FORM_FIELD, DOMAIN_ADAPTER] }
        formTemplateId: { type: [string, 'null'], format: uuid }
        formVersionId: { type: [string, 'null'], format: uuid }
        jsonPointer: { type: [string, 'null'], pattern: '^/' }
        adapterCode: { type: [string, 'null'], maxLength: 80 }
        aggregation: { type: string, enum: [LATEST, SUM, COUNT, RATIO] }
        requiresEvidence: { type: boolean }
        effectiveFrom: { type: string, format: date-time }
        effectiveTo: { type: [string, 'null'], format: date-time }
        reason: { type: string }
    PolicyFields:
      type: object
      required: [effectiveFromDate, timezone, reportOpenLocal, reportCloseLocal, evaluationLocal, failurePenaltyMinor, currency, evidenceEnabled]
      properties:
        effectiveFromDate: { type: string, format: date }
        effectiveToDate: { type: [string, 'null'], format: date }
        timezone: { type: string, example: Asia/Ho_Chi_Minh }
        reportOpenLocal: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$' }
        reportCloseLocal: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$' }
        evaluationLocal: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]:[0-5][0-9]$' }
        failurePenaltyMinor: { type: string, pattern: '^[0-9]+$', default: '100000' }
        currency: { type: string, const: VND }
        kpiDefinitionIds: { type: array, uniqueItems: true, items: { type: string, format: uuid } }
        membershipScope: { type: object }
        exemptionRule: { type: object }
        evidenceEnabled: { type: boolean }
        evidenceGraceSeconds: { type: integer, minimum: 0, maximum: 86400, default: 300 }
        photoPenaltyMinor: { type: [string, 'null'], pattern: '^[0-9]+$' }
    BulkPolicyRequest:
      allOf:
        - $ref: '#/components/schemas/PolicyFields'
        - type: object
          required: [scope, branchIds, reason]
          properties:
            scope: { type: string, enum: [TENANT, BRANCHES] }
            branchIds:
              type: array
              uniqueItems: true
              items: { type: string, format: uuid }
            reason: { type: string, minLength: 3, maxLength: 500 }
      unevaluatedProperties: false
    DailyKpiPolicyVersion:
      allOf:
        - $ref: '#/components/schemas/PolicyFields'
        - type: object
          required: [id, scopeType, branchId, versionNumber]
          properties:
            id: { type: string, format: uuid }
            scopeType: { type: string, enum: [TENANT, BRANCH] }
            branchId: { type: [string, 'null'], format: uuid }
            versionNumber: { type: integer, minimum: 1 }
      unevaluatedProperties: false
    ReportRevision:
      type: object
      additionalProperties: false
      required: [id, reportId, revisionNumber, formSubmissionId, submittedAt, acceptedInWindow]
      properties:
        id: { type: string, format: uuid }
        reportId: { type: string, format: uuid }
        revisionNumber: { type: integer, minimum: 1 }
        formSubmissionId: { type: string, format: uuid }
        submittedAt: { type: string, format: date-time }
        acceptedInWindow: { type: boolean }
    ReportRevisionPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ReportRevision' } }
        nextCursor: { type: [string, 'null'] }
    KpiProgressItem:
      type: object
      additionalProperties: false
      required: [kpiDefinitionId, name, target, actual, remaining, passed, required, sourceStatus, deadlineAt]
      properties:
        kpiDefinitionId: { type: string, format: uuid }
        name: { type: string }
        target: { $ref: '#/components/schemas/ExactValue' }
        actual: { oneOf: [{ $ref: '#/components/schemas/ExactValue' }, { type: 'null' }] }
        remaining: { $ref: '#/components/schemas/ExactValue' }
        passed: { type: boolean }
        required: { type: boolean }
        sourceStatus: { type: string, enum: [FRESH, STALE, MISSING, ERROR] }
        sourceObservedAt: { type: [string, 'null'], format: date-time }
        deadlineAt: { type: string, format: date-time }
        deepLink: { type: string }
    DailyProgress:
      type: object
      required: [businessDate, reportStatus, openedAt, closedAt, items]
      properties:
        businessDate: { type: string, format: date }
        reportStatus: { type: string, enum: [OPEN, SUBMITTED, LATE, CLOSED] }
        openedAt: { type: string, format: date-time }
        closedAt: { type: string, format: date-time }
        items: { type: array, items: { $ref: '#/components/schemas/KpiProgressItem' } }
        evidenceDebt: { oneOf: [{ $ref: '#/components/schemas/EvidenceDebt' }, { type: 'null' }] }
    DailyEvaluation:
      type: object
      required: [id, membershipId, branchId, businessDate, status, policyVersionId, evaluatedAt, failedDetails]
      properties:
        id: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        businessDate: { type: string, format: date }
        status: { $ref: '#/components/schemas/EvaluationStatus' }
        policyVersionId: { type: string, format: uuid }
        evaluatedAt: { type: string, format: date-time }
        failedDetails: { type: array, items: { $ref: '#/components/schemas/KpiProgressItem' } }
    EvaluationPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/DailyEvaluation' } }
        nextCursor: { type: [string, 'null'] }
    PenaltyAdjustment:
      type: object
      required: [id, penaltyId, deltaMinor, currency, effectiveAmountMinor, reason, createdAt]
      properties:
        id: { type: string, format: uuid }
        penaltyId: { type: string, format: uuid }
        deltaMinor: { type: string, pattern: '^-?[0-9]+$' }
        currency: { type: string, const: VND }
        effectiveAmountMinor: { type: string, pattern: '^[0-9]+$' }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    EvidenceDebt:
      type: object
      required: [id, requiredCount, receivedCount, remainingCount, state, deadlineAt]
      properties:
        id: { type: string, format: uuid }
        requiredCount: { type: integer, minimum: 0 }
        receivedCount: { type: integer, minimum: 0 }
        remainingCount: { type: integer, minimum: 0 }
        state: { type: string, enum: [WAITING_PHOTOS, SATISFIED, OVERDUE, WAIVED] }
        deadlineAt: { type: string, format: date-time }
    ActionItem:
      type: object
      required: [id, itemType, state, businessDate, title, deadlineAt, sourceFreshnessAt, deepLink]
      properties:
        id: { type: string, format: uuid }
        ownerMembershipId: { type: string, format: uuid }
        branchId: { type: [string, 'null'], format: uuid }
        itemType: { $ref: '#/components/schemas/ActionItemType' }
        state: { $ref: '#/components/schemas/ActionItemState' }
        businessDate: { type: string, format: date }
        title: { type: string }
        target: { oneOf: [{ $ref: '#/components/schemas/ExactValue' }, { type: 'null' }] }
        actual: { oneOf: [{ $ref: '#/components/schemas/ExactValue' }, { type: 'null' }] }
        remaining: { oneOf: [{ $ref: '#/components/schemas/ExactValue' }, { type: 'null' }] }
        deadlineAt: { type: string, format: date-time }
        sourceFreshnessAt: { type: string, format: date-time }
        deepLink: { type: string }
    ActionItemPage:
      type: object
      required: [items, openCount, nextCursor]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ActionItem' } }
        openCount: { type: integer, minimum: 0 }
        nextCursor: { type: [string, 'null'] }
    ManagedActionItemPage:
      allOf:
        - $ref: '#/components/schemas/ActionItemPage'
        - type: object
          required: [summary]
          properties:
            summary:
              type: object
              required: [missingReports, failedKpis, photoDebts, overdue]
              properties:
                missingReports: { type: integer, minimum: 0 }
                failedKpis: { type: integer, minimum: 0 }
                photoDebts: { type: integer, minimum: 0 }
                overdue: { type: integer, minimum: 0 }
