openapi: 3.1.0
info:
  title: Adsup Timekeeping and Workflow API
  version: 0.1.0
  description: Tenant-scoped contracts for Module 3 schedules, video attendance, approvals, leave calendar and penalties.
servers:
  - url: /api
security:
  - bearerAuth: []
tags:
  - name: Schedules
  - name: Attendance
  - name: Workflows
  - name: Leave
  - name: Penalties
paths:
  /v1/tenants/{tenantId}/attendance/shifts:
    get:
      tags: [Schedules]
      operationId: listShiftDefinitions
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Tenant-scoped shift definitions.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ShiftDefinitionPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/tenants/{tenantId}/attendance/schedules:
    get:
      tags: [Schedules]
      operationId: listWorkSchedules
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: membershipId
          in: query
          schema: { type: string, format: uuid }
        - name: dateFrom
          in: query
          required: true
          schema: { type: string, format: date }
        - name: dateTo
          in: query
          required: true
          schema: { type: string, format: date }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Schedule versions visible to the caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SchedulePage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Schedules]
      operationId: createOrEditMySchedule
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SelfScheduleRequest' }
      responses:
        '201':
          description: Schedule version created or self-edited before the 24 hour cutoff.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkScheduleVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/tenants/{tenantId}/attendance/off-calendar:
    post:
      tags: [Schedules]
      operationId: createCompanyOffCalendarVersion
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOffCalendarRequest' }
      responses:
        '201':
          description: OFF calendar version created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CompanyOffCalendarVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tenants/{tenantId}/attendance/video-policies:
    post:
      tags: [Attendance]
      operationId: createVideoPolicyVersion
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateVideoPolicyRequest' }
      responses:
        '201':
          description: Video policy version created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoPolicyVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tenants/{tenantId}/attendance/video-policy/acknowledgements:
    post:
      tags: [Attendance]
      operationId: acknowledgeVideoPolicy
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [policyVersionId, action]
              properties:
                policyVersionId: { type: string, format: uuid }
                action: { type: string, enum: [ACKNOWLEDGED] }
                deviceId: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201':
          description: Policy acknowledgement recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoPolicyAcknowledgement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tenants/{tenantId}/attendance/check-ins:
    post:
      tags: [Attendance]
      operationId: createVideoCheckIn
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateCheckInRequest' }
      responses:
        '201':
          description: Check-in accepted and video conversion queued.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendanceEvent' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/tenants/{tenantId}/attendance/check-ins/{attendanceEventId}/review:
    post:
      tags: [Attendance]
      operationId: reviewCheckInVideo
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: attendanceEventId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VideoReviewRequest' }
      responses:
        '200':
          description: Manual review recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/VideoReviewResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tenants/{tenantId}/workflows/definitions:
    post:
      tags: [Workflows]
      operationId: createWorkflowDefinitionVersion
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateWorkflowDefinitionRequest' }
      responses:
        '201':
          description: Workflow definition version created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/WorkflowDefinitionVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tenants/{tenantId}/workflows/requests:
    post:
      tags: [Workflows]
      operationId: submitApprovalRequest
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubmitApprovalRequest' }
      responses:
        '201':
          description: Request submitted and routed to approvers.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/Unprocessable' }
  /v1/tenants/{tenantId}/workflows/requests/{requestId}/decisions:
    post:
      tags: [Workflows]
      operationId: recordApprovalDecision
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: requestId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ApprovalDecisionRequest' }
      responses:
        '200':
          description: Decision recorded and final effects applied if complete.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ApprovalRequest' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tenants/{tenantId}/attendance/absences/monthly-summary:
    get:
      tags: [Leave]
      operationId: listMonthlyAbsenceSummaries
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: yearMonth
          in: query
          required: true
          schema: { type: string, pattern: '^\\d{4}-\\d{2}$' }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - name: overThreshold
          in: query
          schema: { type: boolean }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Monthly absence summaries visible to the manager.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MonthlyAbsenceSummaryPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/tenants/{tenantId}/attendance/penalty-policies:
    post:
      tags: [Penalties]
      operationId: createAttendancePenaltyPolicyVersion
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateAttendancePenaltyPolicyRequest' }
      responses:
        '201':
          description: Attendance penalty policy version created.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AttendancePenaltyPolicyVersion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
  /v1/tenants/{tenantId}/attendance/penalty-settlements:
    get:
      tags: [Penalties]
      operationId: listAttendancePenaltySettlements
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: yearMonth
          in: query
          required: true
          schema: { type: string, pattern: '^\\d{4}-\\d{2}$' }
        - name: branchId
          in: query
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Penalty settlements visible to caller.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PenaltySettlementPage' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /v1/tenants/{tenantId}/attendance/penalty-settlements/{settlementId}/payment-transitions:
    post:
      tags: [Penalties]
      operationId: createPenaltyPaymentTransition
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: settlementId
          in: path
          required: true
          schema: { type: string, format: uuid }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentTransitionRequest' }
      responses:
        '200':
          description: Payment transition recorded.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PenaltySettlement' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    TenantId:
      name: tenantId
      in: path
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 8, maxLength: 128 }
    Cursor:
      name: cursor
      in: query
      schema: { type: string, minLength: 1, maxLength: 500 }
  responses:
    BadRequest: { description: Invalid request. }
    Unauthorized: { description: Missing or invalid authentication. }
    Forbidden: { description: Authenticated member lacks required tenant/branch permission. }
    NotFound: { description: Resource not found or not visible in caller scope. }
    Conflict: { description: Idempotency conflict or concurrent state transition conflict. }
    Unprocessable: { description: Business rule violation. }
  schemas:
    PageInfo:
      type: object
      required: [nextCursor]
      properties:
        nextCursor: { type: [string, 'null'] }
    ShiftDefinition:
      type: object
      required: [id, code, name, startLocalTime, timezone, status, versionNumber]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { type: string }
        startLocalTime: { type: string, pattern: '^\\d{2}:\\d{2}$' }
        timezone: { type: string }
        status: { type: string, enum: [ACTIVE, RETIRED] }
        versionNumber: { type: integer, minimum: 1 }
    ShiftDefinitionPage:
      type: object
      required: [items, pageInfo]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/ShiftDefinition' } }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }
    WorkScheduleVersion:
      type: object
      required: [id, membershipId, branchId, businessDate, state, versionNumber]
      properties:
        id: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        businessDate: { type: string, format: date }
        shiftDefinitionId: { type: [string, 'null'], format: uuid }
        state: { type: string, enum: [SCHEDULED, OFF, LEAVE_APPROVED, ADJUSTED, CANCELLED] }
        versionNumber: { type: integer, minimum: 1 }
    SchedulePage:
      type: object
      required: [items, pageInfo]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/WorkScheduleVersion' } }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }
    SelfScheduleRequest:
      type: object
      additionalProperties: false
      required: [businessDate, shiftDefinitionId]
      properties:
        businessDate: { type: string, format: date }
        shiftDefinitionId: { type: string, format: uuid }
        reason: { type: string, minLength: 3, maxLength: 500 }
    CreateOffCalendarRequest:
      type: object
      additionalProperties: false
      required: [scopeType, name, startDate, endDate, reason]
      properties:
        scopeType: { type: string, enum: [TENANT, BRANCH] }
        branchId: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 200 }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        reason: { type: string, minLength: 3, maxLength: 500 }
    CompanyOffCalendarVersion:
      type: object
      required: [id, scopeType, name, startDate, endDate, versionNumber]
      properties:
        id: { type: string, format: uuid }
        scopeType: { type: string, enum: [TENANT, BRANCH] }
        branchId: { type: [string, 'null'], format: uuid }
        name: { type: string }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        versionNumber: { type: integer, minimum: 1 }
    CreateVideoPolicyRequest:
      type: object
      additionalProperties: false
      required:
        [
          scopeType,
          effectiveFromDate,
          requiresAcknowledgement,
          requiresFullBody,
          requiresWorkArea,
          manualReviewRequired,
          missingCheckinPenaltyMinor,
          videoFailedPenaltyMinor,
          reason,
        ]
      properties:
        scopeType: { type: string, enum: [TENANT, BRANCH] }
        branchId: { type: string, format: uuid }
        effectiveFromDate: { type: string, format: date }
        effectiveToDate: { type: [string, 'null'], format: date }
        requiresAcknowledgement: { type: boolean }
        requiresFullBody: { type: boolean, default: true }
        requiresWorkArea: { type: boolean, default: true }
        manualReviewRequired: { type: boolean, default: true }
        acknowledgementText: { type: string, minLength: 1, maxLength: 5000 }
        missingCheckinPenaltyMinor: { type: integer, minimum: 0, default: 50000 }
        videoFailedPenaltyMinor: { type: integer, minimum: 0 }
        currency: { type: string, enum: [VND], default: VND }
        reason: { type: string, minLength: 3, maxLength: 500 }
    VideoPolicyVersion:
      type: object
      required:
        [
          id,
          scopeType,
          versionNumber,
          effectiveFromDate,
          requiresAcknowledgement,
          requiresFullBody,
          requiresWorkArea,
          manualReviewRequired,
          missingCheckinPenaltyMinor,
          videoFailedPenaltyMinor,
          currency,
        ]
      properties:
        id: { type: string, format: uuid }
        scopeType: { type: string, enum: [TENANT, BRANCH] }
        branchId: { type: [string, 'null'], format: uuid }
        versionNumber: { type: integer, minimum: 1 }
        effectiveFromDate: { type: string, format: date }
        effectiveToDate: { type: [string, 'null'], format: date }
        requiresAcknowledgement: { type: boolean }
        requiresFullBody: { type: boolean }
        requiresWorkArea: { type: boolean }
        manualReviewRequired: { type: boolean }
        missingCheckinPenaltyMinor: { type: integer, minimum: 0 }
        videoFailedPenaltyMinor: { type: integer, minimum: 0 }
        currency: { type: string, enum: [VND] }
    VideoPolicyAcknowledgement:
      type: object
      required: [id, policyVersionId, acknowledgedAt]
      properties:
        id: { type: string, format: uuid }
        policyVersionId: { type: string, format: uuid }
        acknowledgedAt: { type: string, format: date-time }
    CreateCheckInRequest:
      type: object
      additionalProperties: false
      required: [businessDate, mediaObjectId]
      properties:
        businessDate: { type: string, format: date }
        mediaObjectId: { type: string, format: uuid }
    AttendanceEvent:
      type: object
      required: [id, membershipId, branchId, businessDate, state, dayClassification]
      properties:
        id: { type: string, format: uuid }
        membershipId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        businessDate: { type: string, format: date }
        state: { type: string, enum: [PENDING_VIDEO, VIDEO_UPLOADED, CONFIRMED, MISSING_CHECK_IN, NON_WORKED, EXEMPT_OFF] }
        dayClassification: { type: string, enum: [WORKED_ON_TIME, WORKED_LATE, NON_WORKED_NO_CHECKIN, OFF_OR_APPROVED_LEAVE] }
        checkInAt: { type: [string, 'null'], format: date-time }
        lateMinutes: { type: [integer, 'null'], minimum: 0 }
    VideoReviewRequest:
      type: object
      additionalProperties: false
      required: [reviewStatus, reason]
      properties:
        reviewStatus: { type: string, enum: [PASSED, FAILED, WAIVED] }
        reason: { type: string, minLength: 3, maxLength: 500 }
        failedCriteria:
          type: array
          items: { type: string, enum: [FULL_BODY, UNIFORM, MAKEUP, HAIR, SHOES, WORK_AREA] }
    VideoReviewResult:
      type: object
      required: [id, attendanceEventId, reviewStatus, reviewedAt]
      properties:
        id: { type: string, format: uuid }
        attendanceEventId: { type: string, format: uuid }
        reviewStatus: { type: string, enum: [PENDING, PASSED, FAILED, WAIVED] }
        reviewedAt: { type: string, format: date-time }
    CreateWorkflowDefinitionRequest:
      type: object
      additionalProperties: false
      required: [requestType, scopeType, steps, reason]
      properties:
        requestType: { type: string, enum: [SHIFT_CHANGE, LATE_NOTICE, LEAVE_SCHEDULE, SUDDEN_LEAVE] }
        scopeType: { type: string, enum: [TENANT, BRANCH] }
        branchId: { type: string, format: uuid }
        steps:
          type: array
          minItems: 1
          items: { $ref: '#/components/schemas/WorkflowStepDefinition' }
        reason: { type: string, minLength: 3, maxLength: 500 }
    WorkflowStepDefinition:
      type: object
      required: [mode, approverRule, requiredApprovalCount]
      properties:
        mode: { type: string, enum: [SEQUENTIAL, PARALLEL] }
        approverRule: { type: string, enum: [DIRECT_MANAGER, TENANT_OWNER, ROLE_PERMISSION, EXPLICIT_MEMBERS] }
        requiredApprovalCount: { type: integer, minimum: 1 }
        permissionCode: { type: string }
        memberIds:
          type: array
          items: { type: string, format: uuid }
    WorkflowDefinitionVersion:
      type: object
      required: [id, requestType, scopeType, versionNumber]
      properties:
        id: { type: string, format: uuid }
        requestType: { type: string, enum: [SHIFT_CHANGE, LATE_NOTICE, LEAVE_SCHEDULE, SUDDEN_LEAVE] }
        scopeType: { type: string, enum: [TENANT, BRANCH] }
        branchId: { type: [string, 'null'], format: uuid }
        versionNumber: { type: integer, minimum: 1 }
    SubmitApprovalRequest:
      type: object
      additionalProperties: false
      required: [requestType, payload, reason]
      properties:
        requestType: { type: string, enum: [SHIFT_CHANGE, LATE_NOTICE, LEAVE_SCHEDULE, SUDDEN_LEAVE] }
        payload: { type: object }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    ApprovalRequest:
      type: object
      required: [id, requestType, status, requestedByMembershipId]
      properties:
        id: { type: string, format: uuid }
        requestType: { type: string, enum: [SHIFT_CHANGE, LATE_NOTICE, LEAVE_SCHEDULE, SUDDEN_LEAVE] }
        status: { type: string, enum: [DRAFT, SUBMITTED, IN_REVIEW, APPROVED, REJECTED, CANCELLED, EXPIRED] }
        requestedByMembershipId: { type: string, format: uuid }
    ApprovalDecisionRequest:
      type: object
      additionalProperties: false
      required: [decision, reason]
      properties:
        decision: { type: string, enum: [APPROVE, REJECT, REQUEST_CHANGES, CANCEL] }
        reason: { type: string, minLength: 3, maxLength: 1000 }
    MonthlyAbsenceSummaryPage:
      type: object
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/MonthlyAbsenceSummary' }
        pageInfo: { $ref: '#/components/schemas/PageInfo' }
    MonthlyAbsenceSummary:
      type: object
      required: [membershipId, branchId, yearMonth, approvedAbsenceDays, overThreshold]
      properties:
        membershipId: { type: string, format: uuid }
        branchId: { type: string, format: uuid }
        yearMonth: { type: string }
        approvedAbsenceDays: { type: string, pattern: '^\\d+(\\.5)?$' }
        overThreshold: { type: boolean }
    PenaltySettlementPage:
      type: object
      required: [items, pageInfo]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/PenaltySettlement' }
